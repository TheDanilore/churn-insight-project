spring.application.name=backend

# ============================================
# CONFIGURACION MULTIPART FILE UPLOAD
# ============================================

# Limites para carga de archivos (para batch predictions)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
spring.servlet.multipart.file-size-threshold=2KB

# Si usas Spring Boot 2.x+ (el proyecto usa Spring Boot 3.x)
# Estas propiedades tambien funcionan:
# spring.servlet.multipart.max-file-size=20MB
# spring.servlet.multipart.max-request-size=20MB

# Tiempo de espera para uploads (en milisegundos)
spring.servlet.multipart.resolve-lazily=false


# ==========================================
# 1. BASE DE DATOS (PostgreSQL)
# ==========================================
# Explicacion: ${DB_HOST:localhost} significa:
# "Busca la variable de entorno DB_HOST via Docker. 
#  Si no existe (estoy en mi PC), usa 'localhost'."

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:churn_db}
spring.datasource.username=${DB_USER:churn_user}
spring.datasource.password=${DB_PASSWORD:churn_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# 2. JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect(deprecated, handled by default)

# ==========================================
# 3. CONFIGURACION PERSONALIZADA (IA)
# ==========================================
# Aqui definimos la URL para conectar con Python.
# En Docker sera "http://ai-service:8000" (nombre del servicio en docker-compose)
# En Local sera "http://localhost:8000"

ai-service.url=${AI_SERVICE_URL:http://localhost:8000}

# ==========================================
# 4. OTROS AJUSTES
# ==========================================
# Configuracion de CORS
# Construimos la URL usando la variable del puerto del frontend
frontend.url=http://localhost:${FRONTEND_PORT:5173}

#Para el buen funcionamiento del BatchService
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true